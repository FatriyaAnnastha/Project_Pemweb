<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar – CariMakan.ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading"><img src="assets/1.Logo_CariMakan.png" alt="Logo"><p>Memuat…</p></div>

<div class="login-page">
    <div class="login-box">
        <div class="logo-wrap"><img src="assets/1.Logo_CariMakan.png" alt="CariMakan"></div>
        <h2>Daftar Akun</h2>
        <p>Bergabung dengan CariMakan.ID</p>

        <div class="role-tabs">
            <button class="role-tab active" onclick="setRole('user',this)">Pengguna Biasa</button>
            <button class="role-tab" onclick="setRole('pedagang',this)">Pedagang</button>
        </div>

        <input type="text" id="r-nama" placeholder="Nama Lengkap">
        <input type="email" id="r-email" placeholder="Email">
        <input type="password" id="r-pass" placeholder="Password">
        <input type="password" id="r-pass2" placeholder="Konfirmasi Password">
        <input type="hidden" id="r-role" value="user">

        <button class="btn-login" onclick="doRegister()">Daftar Sekarang</button>

        <div class="btn-login" style="margin-top: 12px;">
            <a href="beranda.html" style="color: white;">Kembali ke Beranda</a>
        </div>

        <div class="register-link">
            Sudah punya akun? <a href="login.html">Login</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
function setRole(role, el) {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('r-role').value = role;
}
async function doRegister() {
    const nama = document.getElementById('r-nama').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const pass = document.getElementById('r-pass').value;
    const pass2 = document.getElementById('r-pass2').value;
    const role = document.getElementById('r-role').value;
    if (!nama || !email || !pass) { showToast('⚠️ Semua field wajib diisi'); return; }
    if (pass !== pass2) { showToast('⚠️ Password tidak cocok'); return; }
    if (pass.length < 3) { showToast('⚠️ Password minimal 3 karakter'); return; }
    const result = await registerUser(nama, email, pass, role);
    if (result.success) {
        showToast('✅ Akun berhasil dibuat! Silakan login.');
        setTimeout(() => window.location.href = 'login.html', 1500);
    } else {
        showToast('❌ ' + (result.error || 'Gagal registrasi'));
    }
}
</script>
</body>
</html>
