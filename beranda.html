<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda – CariMakan.ID</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loading">
    <img src="assets/1.Logo_CariMakan.png" alt="Logo">
    <p>Memuat…</p>
</div>

<!-- MODAL DETAIL WARUNG -->
<div class="modal-overlay" id="modal-detail">
    <div class="modal-box">
        <button class="modal-close" onclick="tutupModal()">✕</button>
        <div id="modal-content"></div>
    </div>
</div>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="nav-left">
        <img src="assets/1.Logo_CariMakan.png" class="logo" alt="CariMakan">

        <div class="location">
            <img src="assets/3.Logo lokasi.png" class="simbol" alt="lokasi">
            <span id="lokasi-text">Mendeteksi…</span>
        </div>
    </div>

    <div class="nav-right">
        <a href="beranda.html" class="active">Beranda</a>
        <a href="favorit.html">Favorit</a>

        <a href="#" id="dashboard-link" style="display:none;">
            Dashboard
        </a>

        <span class="role-badge user" id="user-name">
            Tamu
        </span>

        <a href="#" onclick="handleAuth()">
            <img src="assets/6.login-avatar.png" class="simbol" alt="lokasi"> <span id="auth-label">Login</span>
        </a>
    </div>

</nav>

<!-- HERO -->
<section class="hero">

    <h1>Temukan Tempat Makan di Sekitarmu!</h1>

    <p>
        Cari berdasarkan lokasi, harga, dan kategori favorit kamu
    </p>

    <div class="search-box">

        
        <select id="filter-harga" onchange="renderWarung()">
            <option value="">Semua Harga</option>
            <option>Murah</option>
            <option>Sedang</option>
            <option>Mahal</option>
        </select>
        
        <select id="filter-lokasi" onchange="renderWarung()">
            <option value="">Semua Lokasi</option>
            <option>Mataram</option>
            <option>Cakranegara</option>
            <option>Ampenan</option>
            <option>Narmada</option>
        </select>
        
        <select id="filter-kategori" onchange="renderWarung()">
            <option value="">Semua Kategori</option>
            <option>Makanan Berat</option>
            <option>Snack</option>
            <option>Minuman</option>
        </select>
        
        <input
            type="text"
            id="q"
            placeholder="Cari langsung..."
            onkeyup="renderWarung()"
        >

        <button onclick="renderWarung()">
           <img src="assets/4.Logo search.png" class="cari" alt="search">
        </button>

    </div>

</section>

<!-- CONTENT -->
<section class="container">

    <h2 class="section-title">
        🍽️ Rekomendasi <span>Tempat Makan</span>
    </h2>

    <div
        id="last-updated"
        style="font-size:11px;color:#aaa;margin-bottom:12px;display:none;"
    >
        🔄 Data diperbarui:
        <span id="updated-time"></span>
    </div>

    <div class="card-container" id="warung-list"></div>

</section>

<!-- FOOTER -->
<footer>
    © 2026 <span>CariMakan.ID</span>
    — Temukan Kelezatan Lokal
</footer>

<!-- JS EKSTERNAL -->
<script src="app.js"></script>

<script>


window.addEventListener('load', () => {
    const s = getSession();

    if (s) {

        document.getElementById('user-name').textContent = s.nama;

        document.getElementById('auth-label').textContent = 'Logout';

        const dashboardLink = document.getElementById('dashboard-link');

        dashboardLink.style.display = 'inline-block';

        if (s.role === 'admin') {

            dashboardLink.href = 'dashboard-admin.html';

        }

        else if (s.role === 'pedagang') {

            dashboardLink.href = 'dashboard-pedagang.html';

        }

        else if (s.role === 'user'){

           dashboardLink.style.display = 'none';

        } else {

            dashboardLink.style.display = 'inline-block';
            dashboardLink.href = s.role === 'admin' ? 'dashboard-admin.html' : 'dashboard-pedagang.html';

        }

    }

    renderWarung();

    detectLokasi();

});


/* =========================
   AUTO REFRESH
========================= */

window.addEventListener('storage', (e) => {

    if (e.key === 'cm_warung') {

        renderWarung();

        tampilkanWaktuUpdate();

    }

});


function tampilkanWaktuUpdate() {

    const jam = new Date().toLocaleTimeString(
        'id-ID',
        {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        }
    );

    document.getElementById('last-updated').style.display = 'block';

    document.getElementById('updated-time').textContent = jam;

}


/* =========================
   DETEKSI LOKASI
========================= */

function detectLokasi() {

    if (!navigator.geolocation) {

        document.getElementById('lokasi-text').textContent =
            'Lokasi tidak tersedia';

        return;

    }

    navigator.geolocation.getCurrentPosition(

        () => {

            document.getElementById('lokasi-text').textContent =
                'Lokasi ditemukan';

        },

        () => {

            document.getElementById('lokasi-text').textContent =
                'Mataram, NTB';

        }

    );

}


/* =========================
   LOGIN / LOGOUT
========================= */

function handleAuth() {

    if (getSession()) {

        logout();

    }

    else {

        window.location.href = 'login.html';

    }

}


/* =========================
   STATUS BUKA / TUTUP
========================= */

function cekStatusBuka(w) {

    if (
        !w.jamBuka ||
        !w.jamTutup ||
        !w.hariKerja ||
        w.hariKerja.length === 0
    ) {
        return null;
    }

    const now = new Date();

    const hari = [
        'Min',
        'Sen',
        'Sel',
        'Rab',
        'Kam',
        'Jum',
        'Sab'
    ][now.getDay()];

    const hm =
        now.getHours() * 60 +
        now.getMinutes();

    const [bh, bm] =
        w.jamBuka.split(':').map(Number);

    const [th, tm] =
        w.jamTutup.split(':').map(Number);

    const buka =
        bh * 60 + bm;

    const tutup =
        th * 60 + tm;

    const hariMatch =
        w.hariKerja.includes(hari);

    const jamMatch =
        hm >= buka && hm <= tutup;

    return hariMatch && jamMatch;

}


/* =========================
   RENDER WARUNG
========================= */

function renderWarung() {

    const q =
        document.getElementById('q')
        .value
        .toLowerCase()
        .trim();

    const harga =
        document.getElementById('filter-harga').value;

    const lokasi =
        document.getElementById('filter-lokasi').value;

    const kat =
        document.getElementById('filter-kategori').value;

    let list =
        getWarung().filter(w => w.status === 'aktif');

    if (q) {

        list = list.filter(w =>

            w.nama.toLowerCase().includes(q) ||

            w.kategori.toLowerCase().includes(q) ||

            (
                w.deskripsi &&
                w.deskripsi.toLowerCase().includes(q)
            )

        );

    }

    if (harga) {

        list = list.filter(w => w.harga === harga);

    }

    if (lokasi) {

        list = list.filter(w => w.lokasi === lokasi);

    }

    if (kat) {

        list = list.filter(w => w.kategori === kat);

    }

    const container =
        document.getElementById('warung-list');

    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                <div class="big-icon">🍽️</div>
                <p>Tidak ada tempat makan yang ditemukan.</p>
            </div>
        `;

        return;

    }

    container.innerHTML = list.map(w => {

        const lokasiUrl =
            (w.lat && w.lng)

            ? `https://www.google.com/maps?q=${w.lat},${w.lng}`

            : `https://www.google.com/maps/search/${encodeURIComponent(w.nama + ' ' + w.lokasi)}`;

        const sudahFavorit =
            isFavorit(w.id);

        const statusBuka =
            cekStatusBuka(w);

        let chipStatus = '';

        if (statusBuka === true) {

            chipStatus =
                `<span class="info-chip chip-buka">🟢 Buka</span>`;

        }

        else if (statusBuka === false) {

            chipStatus =
                `<span class="info-chip chip-tutup">🔴 Tutup</span>`;

        }

        let chipJam = '';

        if (w.jamBuka && w.jamTutup) {

            chipJam =
                `<span class="info-chip">🕐 ${w.jamBuka}–${w.jamTutup}</span>`;

        }

        let chipHari = '';

        if (w.hariKerja && w.hariKerja.length > 0) {

            chipHari =
                `<span class="info-chip">📅 ${w.hariKerja.join(', ')}</span>`;

        }

        let chipWA = '';

        if (w.wa) {

            chipWA =
                `<a href="https://wa.me/62${w.wa.replace(/^0/, '')}"
                    target="_blank"
                    class="info-chip chip-wa">
                    💬 WhatsApp
                </a>`;

        }

        let previewMenu = '';

        if (w.menu && w.menu.length > 0) {

            const tampil = w.menu
                .slice(0, 2)
                .map(m => `
                    <span style="font-size:11px;color:#888;">
                        ${m.nama}
                        ${m.harga
                            ? ' – Rp' + Number(m.harga).toLocaleString('id-ID')
                            : ''}
                    </span>
                `)
                .join('<br>');

            const sisanya =
                w.menu.length > 2
                ? `<span style="font-size:11px;color:#aaa;">
                    +${w.menu.length - 2} menu lainnya
                   </span>`
                : '';

            previewMenu = `
                <div style="margin:4px 0 8px;line-height:1.8;">
                    ${tampil}
                    ${sisanya ? '<br>' + sisanya : ''}
                </div>
            `;

        }

        return `

        <div class="card" id="card-${w.id}">

            <img
                src="${w.img || '4.bakso.jpeg'}"
                alt="${w.nama}"
                onerror="this.src='4.bakso.jpeg'"
            >

            <div class="card-body">

                <h3>${w.nama}</h3>

                <p>⭐ ${w.rating || 0} | ${w.lokasi}</p>

                <p style="font-size:11.5px;color:#aaa;margin-bottom:4px;">
                    ${w.kategori} • ${w.harga}
                </p>

                <div class="info-strip">
                    ${chipStatus}
                    ${chipJam}
                    ${chipHari}
                    ${chipWA}
                </div>

                ${previewMenu}

                <div class="card-actions">

                    <button
                        class="btn btn-sm btn-outline"
                        onclick="bukaDetail(${w.id})"
                    >
                        📋 Detail
                    </button>

                    <button
                        class="btn btn-sm ${sudahFavorit ? 'btn-primary' : 'btn-outline'}"
                        id="fav-btn-${w.id}"
                        onclick="toggleFavoritDanUpdate(${w.id}, '${w.nama}')"
                    >
                        ❤️ ${sudahFavorit ? 'Difavoritkan' : 'Favorit'}
                    </button>

                    <a
                        href="${lokasiUrl}"
                        target="_blank"
                        class="btn btn-sm btn-primary"
                        style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;"
                    >
                        📍 Lokasi
                    </a>

                </div>

            </div>

        </div>

        `;

    }).join('');

}


/* =========================
   MODAL DETAIL
========================= */

function bukaDetail(id) {

    const w =
        getWarung().find(x => x.id === id);

    if (!w) return;

    const statusBuka =
        cekStatusBuka(w);

    const statusTeks =
        statusBuka === true

        ? '<span class="status-buka">🟢 Sedang Buka</span>'

        : statusBuka === false

        ? '<span class="status-tutup">🔴 Sedang Tutup</span>'

        : '';

    const lokasiUrl =
        (w.lat && w.lng)

        ? `https://www.google.com/maps?q=${w.lat},${w.lng}`

        : `https://www.google.com/maps/search/${encodeURIComponent(w.nama + ' ' + w.lokasi)}`;

    const menuHtml =
        (w.menu && w.menu.length > 0)

        ? `
        <table class="modal-menu-table">

            <thead>
                <tr>
                    <th>Menu</th>
                    <th>Harga</th>
                </tr>
            </thead>

            <tbody>

                ${w.menu.map(m => `
                <tr>

                    <td>

                     ${
                        m.gambar
                        ?
                        `<img
                            src="${m.gambar}"
                            style="
                                width:70px;
                                height:70px;
                                object-fit:cover;
                                border-radius:8px;
                                margin-bottom:4px;
                            ">
                        <br>`
                        :
                        ''
                    }

                     ${m.nama}

                </td>

                 <td>

                    ${
                        m.harga
                        ?
                        'Rp ' + Number(m.harga).toLocaleString('id-ID')
                        :
                        '–'
                    }

                 </td>

                </tr>
                `).join('')}

            </tbody>

        </table>
        `

        : `
        <p style="color:#aaa;font-size:13px;">
            Belum ada menu tersedia.
        </p>
        `;

    const hariHtml =
        (w.hariKerja && w.hariKerja.length > 0)

        ? w.hariKerja.join(', ')

        : '–';

    const waHtml =
        w.wa

        ? `
        <a
            href="https://wa.me/62${w.wa.replace(/^0/,'')}"
            target="_blank"
            style="color:#1565c0;"
        >
            💬 Chat WhatsApp (${w.wa})
        </a>
        `

        : '–';

    document.getElementById('modal-content').innerHTML = `

        <img
            src="${w.img || '4.bakso.jpeg'}"
            alt="${w.nama}"
            onerror="this.src='4.bakso.jpeg'"
            style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:14px;"
        >

        <h2 style="margin:0 0 4px;">
            ${w.nama}
        </h2>

        <p style="color:#888;font-size:13px;margin:0 0 10px;">
            ${w.kategori} • ${w.harga} • ${w.lokasi}
        </p>

        ${statusTeks ? `<p style="margin:0 0 10px;">${statusTeks}</p>` : ''}

        ${w.deskripsi
            ? `<p style="font-size:13px;color:#555;margin:0 0 12px;">
                ${w.deskripsi}
               </p>`
            : ''
        }

        <div
            style="
                display:flex;
                flex-direction:column;
                gap:6px;
                font-size:13px;
                margin-bottom:14px;
            "
        >

            <div>
                🕐 <strong>Jam Buka:</strong>
                ${w.jamBuka || '–'} – ${w.jamTutup || '–'}
            </div>

            <div>
                📅 <strong>Hari Buka:</strong>
                ${hariHtml}
            </div>

            <div>
                📞 <strong>Kontak:</strong>
                ${waHtml}
            </div>

            <div>
                ⭐ <strong>Rating:</strong>
                ${w.rating || 0}
            </div>

        </div>

        <h4 style="margin:0 0 6px;">
            🍽️ Menu
        </h4>

        ${menuHtml}

        <div style="display:flex;gap:10px;margin-top:16px;">

            <a
                href="${lokasiUrl}"
                target="_blank"
                class="btn btn-primary"
                style="text-decoration:none;flex:1;text-align:center;"
            >
                📍 Lihat di Maps
            </a>

            ${w.wa
                ? `
                <a
                    href="https://wa.me/62${w.wa.replace(/^0/,'')}"
                    target="_blank"
                    class="btn btn-outline"
                    style="text-decoration:none;flex:1;text-align:center;"
                >
                    💬 WhatsApp
                </a>
                `
                : ''
            }

        </div>

    `;

    document
        .getElementById('modal-detail')
        .classList.add('open');

}


function tutupModal() {

    document
        .getElementById('modal-detail')
        .classList.remove('open');

}


/* =========================
   TUTUP MODAL KLIK LUAR
========================= */

document
.getElementById('modal-detail')
.addEventListener('click', function(e) {

    if (e.target === this) {

        tutupModal();

    }

});


/* =========================
   FAVORIT
========================= */

function toggleFavoritDanUpdate(id, nama) {

    toggleFavorit(id, nama);

    const btn =
        document.getElementById('fav-btn-' + id);

    if (!btn) return;

    const sudahFavorit =
        isFavorit(id);

    btn.className =
        'btn btn-sm ' +
        (sudahFavorit ? 'btn-primary' : 'btn-outline');

    btn.innerHTML =
        '❤️ ' +
        (sudahFavorit ? 'Difavoritkan' : 'Favorit');

}

// Tampilkan bintang rating (HTML)
function renderStars(rating) {
    let full = Math.floor(rating);
    let half = rating % 1 >= 0.5 ? 1 : 0;
    let starHtml = '';
    for (let i = 0; i < full; i++) starHtml += '⭐';
    if (half) starHtml += '½⭐';
    for (let i = 0; i < 5 - full - half; i++) starHtml += '☆';
    return starHtml;
}

// Submit ulasan
function submitReview(warungId) {
    const rating = parseInt(document.getElementById('review-rating').value);
    const komentar = document.getElementById('review-komentar').value;
    if (!rating || rating < 1 || rating > 5) {
        showToast('Pilih rating 1–5 bintang!');
        return;
    }
    if (!komentar.trim()) {
        showToast('Komentar tidak boleh kosong!');
        return;
    }
    if (addReview(warungId, rating, komentar)) {
        showToast('✅ Ulasan berhasil ditambahkan!');
        tutupModal();
        setTimeout(() => bukaDetail(warungId), 500);
    } else {
        showToast('❌ Gagal menambahkan ulasan. Pastikan Anda login sebagai pengguna biasa.');
    }
}

// bagian ulasan & form
function bukaDetail(id) {
    const w = getWarung().find(x => x.id === id);
    if (!w) return;
    const statusBuka = cekStatusBuka(w);
    const statusTeks = statusBuka === true ? '<span class="status-buka">🟢 Sedang Buka</span>' : (statusBuka === false ? '<span class="status-tutup">🔴 Sedang Tutup</span>' : '');
    const lokasiUrl = (w.lat && w.lng) ? `https://www.google.com/maps?q=${w.lat},${w.lng}` : `https://www.google.com/maps/search/${encodeURIComponent(w.nama + ' ' + w.lokasi)}`;

    const menuHtml = (w.menu && w.menu.length > 0) ? `
        <table class="modal-menu-table">
            <thead><tr><th>Menu</th><th>Harga</th></tr></thead>
            <tbody>${w.menu.map(m => `<tr><td>${m.nama}</td><td>${m.harga ? 'Rp ' + Number(m.harga).toLocaleString('id-ID') : '–'}</td></tr>`).join('')}</tbody>
        </table>` : '<p style="color:#aaa;font-size:13px;">Belum ada menu tersedia.</p>';

    const hariHtml = (w.hariKerja && w.hariKerja.length > 0) ? w.hariKerja.join(', ') : '–';
    const waHtml = w.wa ? `<a href="https://wa.me/62${w.wa.replace(/^0/,'')}" target="_blank" style="color:#1565c0;">💬 Chat WhatsApp (${w.wa})</a>` : '–';

    // ambil ulasan
    const reviews = getReviews(id);
    const avgRating = w.rating || 0;
    const reviewListHtml = reviews.length ? reviews.map(rv => `
        <div style="border-bottom:1px solid #eee; padding:8px 0;">
            <div style="display:flex; justify-content:space-between;">
                <strong>${rv.userName}</strong>
                <span>${renderStars(rv.rating)}</span>
            </div>
            <p style="font-size:12px; margin:4px 0;">${rv.komentar}</p>
            <span style="font-size:10px; color:#aaa;">${new Date(rv.tanggal).toLocaleDateString('id-ID')}</span>
        </div>
    `).join('') : '<p style="color:#aaa; font-size:12px;">Belum ada ulasan. Jadilah yang pertama!</p>';

    const session = getSession();
    const isUser = session && session.role === 'user';
    const formReview = isUser ? `
        <hr style="margin:12px 0;">
        <h4>➕ Tambah Ulasan</h4>
        <div style="margin-bottom:8px;">
            <label>Rating: </label>
            <select id="review-rating" style="padding:6px;border-radius:8px;">
                <option value="">-- Pilih --</option>
                <option value="1">⭐ 1</option><option value="2">⭐⭐ 2</option>
                <option value="3">⭐⭐⭐ 3</option><option value="4">⭐⭐⭐⭐ 4</option>
                <option value="5">⭐⭐⭐⭐⭐ 5</option>
            </select>
        </div>
        <textarea id="review-komentar" rows="2" placeholder="Tulis komentar Anda..." style="width:100%; border-radius:8px; padding:8px;"></textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="submitReview(${id})">Kirim Ulasan</button>
    ` : (session ? '<p style="font-size:12px; color:#aaa;">⭐ Ulasan hanya untuk pengguna biasa.</p>' : '<p style="font-size:12px; color:#aaa;">🔒 Login sebagai pengguna untuk memberi ulasan.</p>');

    document.getElementById('modal-content').innerHTML = `
        <img src="${w.img || '4.bakso.jpeg'}" alt="${w.nama}" onerror="this.src='4.bakso.jpeg'" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:14px;">
        <h2 style="margin:0 0 4px;">${w.nama}</h2>
        <p style="color:#888;font-size:13px;margin:0 0 10px;">${w.kategori} • ${w.harga} • ${w.lokasi}</p>
        ${statusTeks ? `<p style="margin:0 0 10px;">${statusTeks}</p>` : ''}
        <p style="margin:0 0 6px;"><strong>⭐ Rating:</strong> ${avgRating} ${renderStars(avgRating)}</p>
        ${w.deskripsi ? `<p style="font-size:13px;color:#555;margin:0 0 12px;">${w.deskripsi}</p>` : ''}
        <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:14px;">
            <div>🕐 <strong>Jam Buka:</strong> ${w.jamBuka || '–'} – ${w.jamTutup || '–'}</div>
            <div>📅 <strong>Hari Buka:</strong> ${hariHtml}</div>
            <div>📞 <strong>Kontak:</strong> ${waHtml}</div>
        </div>
        <h4 style="margin:0 0 6px;">🍽️ Menu</h4>
        ${menuHtml}
        <hr style="margin:12px 0;">
        <h4>📝 Ulasan (${reviews.length})</h4>
        <div style="max-height:200px; overflow-y:auto; margin-bottom:12px;">${reviewListHtml}</div>
        ${formReview}
        <div style="display:flex;gap:10px;margin-top:16px;">
            <a href="${lokasiUrl}" target="_blank" class="btn btn-primary" style="text-decoration:none;flex:1;text-align:center;">📍 Lihat di Maps</a>
            ${w.wa ? `<a href="https://wa.me/62${w.wa.replace(/^0/,'')}" target="_blank" class="btn btn-outline" style="text-decoration:none;flex:1;text-align:center;">💬 WhatsApp</a>` : ''}
        </div>
    `;
    document.getElementById('modal-detail').classList.add('open');
}

</script>

</body>
</html>
