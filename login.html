<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CariMakan.ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading">
    <img src="7.Logo_CariMakan.png" alt="Logo">
    <p>Memuat halaman…</p>
</div>

<div class="login-page">
    <div class="login-box">
        <div class="logo-wrap">
            <img src="7.Logo_CariMakan.png" alt="CariMakan">
        </div>
        <h2>Selamat Datang!</h2>
        <p>Masuk ke akun CariMakan.ID</p>

        <div class="role-tabs">
            <button class="role-tab active" onclick="setRoleTab('user',this)">👤 Pengguna</button>
            <button class="role-tab" onclick="setRoleTab('pedagang',this)">🏪 Pedagang</button>
            <button class="role-tab" onclick="setRoleTab('admin',this)">🛡️ Admin</button>
        </div>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <input type="hidden" id="role" value="user">

        <div id="hint" style="font-size:11.5px;opacity:0.75;margin-bottom:10px;line-height:1.6;">
            Demo: user@mail.com / 123
        </div>

        <button class="btn-login" onclick="loginUser()">Masuk 🚀</button>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Daftar Sekarang</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
const hints = {
    user: 'Demo: user@mail.com / 123',
    pedagang: 'Demo: pedagang@mail.com / 123',
    admin: 'Demo: admin@mail.com / 123',
};

function setRoleTab(role, el) {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('role').value = role;
    document.getElementById('hint').innerHTML = hints[role];
    // prefill demo
    document.getElementById('email').value = role + '@mail.com';
    document.getElementById('password').value = '123';
}

function loginUser() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    if (!email) { showToast('⚠️ Isi email terlebih dahulu!'); return; }
    if (!password) { showToast('⚠️ Isi password terlebih dahulu!'); return; }

    const user = DEMO_USERS.find(u => u.email === email && u.password === password && u.role === role);
    if (!user) {
        showToast('❌ Email, password, atau role salah!');
        return;
    }

    setSession(user);
    showToast('✅ Login berhasil! Mengalihkan…');

    const redirect = { user: 'beranda.html', pedagang: 'dashboard-pedagang.html', admin: 'dashboard-admin.html' };
    setTimeout(() => window.location.href = redirect[role], 1000);
}
</script>
</body>
</html>
